<!DOCTYPE html>
<html lang="lv">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Latvijas stāsti</title>
<style>
:root{--bg:#efe6d2;--paper:#fffaf0;--ink:#2b2218;--muted:#6b5d4c;--red:#b3361f;--line:#cdbfa3;--land:#e3d3a8;--sea:#cfe3e8;--fs:18px;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#10182a;--paper:#1c2540;--ink:#f1ead9;--muted:#b4b9c9;--red:#ff8a6b;--line:#3a4668;--land:#3b4a72;--sea:#16203a}}
:root[data-theme="dark"]{--bg:#10182a;--paper:#1c2540;--ink:#f1ead9;--muted:#b4b9c9;--red:#ff8a6b;--line:#3a4668;--land:#3b4a72;--sea:#16203a}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;color:var(--ink);background:var(--bg);font:var(--fs)/1.55 Georgia,"Times New Roman",serif}
.wrap{max-width:960px;margin:0 auto;padding:16px}
header{display:flex;flex-wrap:wrap;gap:12px;justify-content:space-between;align-items:flex-start;margin-bottom:8px}
h1{font-size:1.9em;margin:0;line-height:1.1}
.sub{color:var(--red);font-style:italic;margin:2px 0 0}
.tools{display:flex;gap:6px;flex-wrap:wrap}
button{font:inherit;cursor:pointer;color:inherit}
.tool{background:var(--paper);border:2px solid var(--line);border-radius:8px;padding:4px 11px;min-height:40px}
.tool[aria-pressed="true"]{background:var(--red);border-color:var(--red);color:#fff}
.btn{background:var(--red);color:#fff;border:0;border-radius:10px;padding:10px 16px;min-height:44px;font-weight:700}
.btn.ghost{background:transparent;color:var(--ink);border:2px solid var(--line)}
:focus-visible{outline:3px solid var(--red);outline-offset:2px}
h2{margin:20px 0 6px}
.muted,.hint{color:var(--muted)}.small{font-size:.8em;margin:4px 0}
.mapbox{position:relative;background:var(--sea);border:2px solid var(--line);border-radius:14px;padding:8px}
svg.map{display:block;width:100%;height:auto}
.land{fill:var(--land);stroke:var(--ink);stroke-width:1.5;stroke-linejoin:round}
.pin{cursor:pointer}.pin circle:first-child{fill:var(--red);stroke:#fff;stroke-width:3;transition:r .15s}
.pin .hit{fill:transparent}
.pin:hover circle:first-child,.pin:focus circle:first-child{r:12}
.pin:focus{outline:none}.pin:focus circle:first-child{stroke:var(--ink)}
.dot{fill:var(--red);stroke:#fff;stroke-width:3}
.tip{position:absolute;width:250px;display:flex;gap:10px;background:var(--paper);border:2px solid var(--line);border-radius:10px;padding:8px;box-shadow:0 6px 20px rgba(0,0,0,.35);pointer-events:none;font-size:.78em;line-height:1.35;z-index:5}
.tip[hidden]{display:none}.tip i{color:var(--red)}
.pic{background:var(--g);border-radius:10px;display:grid;place-items:center;position:relative;overflow:hidden}
.pic::before{content:"";position:absolute;width:30%;aspect-ratio:1;border-radius:50%;background:rgba(255,255,255,.35);top:10%;right:10%}
.pic span{position:relative}
.pic.mini{width:64px;height:64px;flex:none;font-size:2em}
.pic.big{width:100%;height:240px;font-size:6em;margin:10px 0}
img.photo{width:100%;max-height:340px;object-fit:cover;border-radius:10px;margin:10px 0}
input{width:100%;font:inherit;padding:12px;border:2px solid var(--line);border-radius:10px;background:var(--paper);color:var(--ink)}
label{font-weight:700;display:block;margin:8px 0 4px}
.city{background:var(--paper);border:1px solid var(--line);border-radius:12px;padding:6px 16px 10px;margin:10px 0}
.city h3{margin:6px 0;color:var(--red)}
.city ul{list-style:none;margin:0;padding:0;display:flex;flex-wrap:wrap;gap:8px}
.city a{display:inline-block;padding:8px 14px;min-height:42px;border:2px solid var(--line);border-radius:999px;color:var(--ink);text-decoration:none}
.city a:hover,.city a:focus-visible{border-color:var(--red)}
.obj{background:var(--paper);border:1px solid var(--line);border-radius:14px;padding:6px 20px 20px;margin-top:12px}
.obj h2{font-size:1.8em;margin:8px 0 0}.obj h3{color:var(--red);margin:18px 0 4px}
dl{display:grid;grid-template-columns:max-content 1fr;gap:6px 16px;margin:16px 0}
dt{font-weight:700}dd{margin:0}
a{color:var(--red)}
.mini-map{max-width:440px}
footer{color:var(--muted);font-size:.8em;margin:24px 0}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<div class="wrap">
<header>
  <div><h1 id="ttl"></h1><p class="sub" id="sub"></p></div>
  <div class="tools">
    <div class="tools" role="group" aria-label="Language / Valoda / Язык" id="langs"></div>
    <button class="tool" id="smaller">A−</button>
    <button class="tool" id="bigger">A+</button>
    <button class="tool" id="theme"></button>
  </div>
</header>
<main id="view"></main>
<footer>Skolas hakatona projekts · Hackathon school project · Школьный проект хакатона</footer>
</div>

// === PAŠU RAKSTĪTAIS KODS (komandai: uzrakstiet šo funkciju paši, bez MI) ===
// Atgriež objektus, kuru nosaukumā (izvēlētajā valodā) ir ievadītais teksts, ignorējot garumzīmes un lielos burtus.
function atrastObjektus(teksts){
  const norm=s=>s.toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g,"");
  const x=norm(teksts.trim());
  return O.filter(o=>norm(o.n[L]).includes(x));
}
// === PAŠU KODA BEIGAS ===

function mapSVG(list,one){
  const path="M"+B.map(p=>px(p[0]).toFixed(1)+","+py(p[1]).toFixed(1)).join("L")+"Z";
  const cnt={},idx={};list.forEach(o=>cnt[o.c]=(cnt[o.c]||0)+1);
  const pins=list.map(o=>{
    let x=px(o.lon);const y=py(o.lat);
    if(one)return`<circle class="dot" cx="${x.toFixed(1)}" cy="${y.toFixed(1)}" r="9"/>`;
    if(cnt[o.c]>1){idx[o.c]=idx[o.c]||0;x+=(idx[o.c]++-(cnt[o.c]-1)/2)*20}
    return`<g class="pin" tabindex="0" role="link" data-id="${o.id}" aria-label="${o.n[L]}"><circle cx="${x.toFixed(1)}" cy="${y.toFixed(1)}" r="9"/><circle class="hit" cx="${x.toFixed(1)}" cy="${y.toFixed(1)}" r="17"/></g>`;
  }).join("");
  return`<svg class="map${one?" mini-map":""}" viewBox="0 0 580 350" role="img" aria-label="${t("map")}"><path class="land" d="${path}"/>${pins}</svg>`;
}
function showTip(g){
  const o=O.find(x=>x.id===g.dataset.id),tip=$("#tip"),mb=$("#mb");
  tip.innerHTML=pic(o,0)+`<div><b>${o.n[L]}</b><br>${first(o.s[L])}<br><i>${t("tap")}</i></div>`;
  tip.hidden=false;
  const r=g.getBoundingClientRect(),b=mb.getBoundingClientRect();
  tip.style.left=Math.max(0,Math.min(r.left-b.left+r.width/2-125,b.width-250))+"px";
  let top=r.top-b.top-tip.offsetHeight-8;if(top<0)top=r.bottom-b.top+8;
  tip.style.top=top+"px";
}
function renderList(){
  const found=atrastObjektus(q),cities=[...new Set(O.map(o=>o.c))];
  const h=cities.map(c=>{
    const a=found.filter(o=>o.c===c);if(!a.length)return"";
    return`<section class="city"><h3>${CN[c][L]}</h3><ul>${a.map(o=>`<li><a href="#${o.id}">${o.e} ${o.n[L]}</a></li>`).join("")}</ul></section>`;
  }).join("");
  $("#res").innerHTML=h||`<p class="muted">${t("none")}</p>`;
}
function home(){
  $("#view").innerHTML=`<p class="hint">${t("hint")}</p><div class="mapbox" id="mb">${mapSVG(O,false)}<div class="tip" id="tip" hidden></div></div><p class="muted small">${t("schem")}</p><h2>${t("list")}</h2><label for="q">${t("search")}</label><input id="q" type="search" autocomplete="off" placeholder="${t("ph")}"><div id="res"></div>`;
  $("#q").value=q;$("#q").oninput=e=>{q=e.target.value;renderList()};
  const mb=$("#mb"),pin=e=>e.target.closest(".pin");
  ["mouseover","focusin"].forEach(ev=>mb.addEventListener(ev,e=>{const g=pin(e);if(g)showTip(g)}));
  ["mouseout","focusout"].forEach(ev=>mb.addEventListener(ev,e=>{if(pin(e))$("#tip").hidden=true}));
  mb.addEventListener("click",e=>{const g=pin(e);if(g)location.hash=g.dataset.id});
  mb.addEventListener("keydown",e=>{const g=pin(e);if(g&&e.key==="Enter")location.hash=g.dataset.id});
  renderList();
}
function setAud(on){const b=$("#aud");if(b)b.textContent=on?t("stop"):t("listen")}
function speak(o){
  const syn=window.speechSynthesis,note=$("#anote");note.textContent="";
  if(!syn){note.textContent=t("nosyn");return}
  if(syn.speaking){syn.cancel();setAud(false);return}
  const v=syn.getVoices();
  if(v.length&&!v.some(x=>x.lang.toLowerCase().startsWith(L))){note.textContent=t("novoice");return}
  const u=new SpeechSynthesisUtterance(o.n[L]+". "+o.s[L]);
  u.lang={lv:"lv-LV",en:"en-GB",ru:"ru-RU"}[L];u.onend=u.onerror=()=>setAud(false);
  syn.speak(u);setAud(true);
}
function obj(o){
  $("#view").innerHTML=`<p><button class="btn ghost" id="bk">${t("back")}</button></p><article class="obj">${pic(o,1)}<h2>${o.n[L]}</h2><p class="muted">${CN[o.c][L]}</p><h3>${t("story")}</h3><p>${o.s[L]}</p><p><button class="btn" id="aud">${t("listen")}</button></p><p class="muted" id="anote" role="status"></p><dl><dt>${t("fee")}</dt><dd>${o.fee?(o.p?o.p+". ":"")+t("paid"):t("free")}</dd><dt>${t("link")}</dt><dd><a href="${o.u}" target="_blank" rel="noopener noreferrer">${o.u.replace("https://","")}</a></dd></dl><h3>${t("loc")}</h3>${mapSVG([o],true)}<p class="small muted">${o.lat.toFixed(4)}, ${o.lon.toFixed(4)} · <a href="https://www.google.com/maps?q=${o.lat},${o.lon}" target="_blank" rel="noopener noreferrer">${t("gmaps")}</a></p></article>`;
  $("#bk").onclick=()=>{location.hash=""};
  $("#aud").onclick=()=>speak(o);
}
function route(){
  if(window.speechSynthesis)speechSynthesis.cancel();
  const o=O.find(x=>x.id===location.hash.slice(1));
  o?obj(o):home();window.scrollTo(0,0);
}
function chrome(){
  document.documentElement.lang=L;document.title=t("title");
  $("#ttl").textContent=t("title");$("#sub").textContent=t("sub");$("#theme").textContent=t("theme");
  $("#langs").innerHTML=["lv","en","ru"].map(l=>`<button class="tool" data-l="${l}" aria-pressed="${l===L}">${l.toUpperCase()}</button>`).join("");
}
$("#langs").addEventListener("click",e=>{
  const l=e.target.dataset.l;if(!l)return;L=l;try{localStorage.setItem("lang",L)}catch(x){}
  chrome();route();
});
window.addEventListener("hashchange",route);

// Pieejamība: burtu izmērs un tēma
let fs=18;
try{fs=parseInt(localStorage.getItem("fs"))||18;const th=localStorage.getItem("th");if(th)document.documentElement.dataset.theme=th}catch(e){}
function setFs(v){fs=Math.min(26,Math.max(14,v));document.documentElement.style.setProperty("--fs",fs+"px");try{localStorage.setItem("fs",fs)}catch(e){}}
setFs(fs);
$("#bigger").onclick=()=>setFs(fs+2);$("#smaller").onclick=()=>setFs(fs-2);
$("#theme").onclick=()=>{
  const c=document.documentElement.dataset.theme||(matchMedia("(prefers-color-scheme:dark)").matches?"dark":"light");
  const n=c==="dark"?"light":"dark";document.documentElement.dataset.theme=n;
  try{localStorage.setItem("th",n)}catch(e){}
};
chrome();route();
</script>
</body>
</html>
